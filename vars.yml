# Docker/Directories
internal_network: "media-network"
public_network: "reverse-proxy"

root_dir: "/home/{{ ansible_user }}/{{ server_name }}"
# content_dir, bind_host, enable_firewall, vpn_enabled, vpn_provider,
# vpn_type, ssh_port, and the VPN credential vars are intentionally NOT
# defaulted here — only in inventory.example.ini and via `| default(...)`
# filters at each point of use in the templates/playbook. Defining them here
# too used to cause vars.yml to silently win over inventory.ini's overrides
# whenever the playbook's `gather_facts: yes` ran (an ansible-core
# vars_files/inventory-vars precedence quirk) — since inventory.ini's
# deployment-specific values differ from these VPS-safe defaults, that meant
# they'd silently revert to the vars.yml default on every real run despite
# inventory.ini saying otherwise.
media_dir: "{{ content_dir | default(root_dir ~ '/content') }}/media"
torrents_dir: "{{ content_dir | default(root_dir ~ '/content') }}/torrents"
config_dir: "{{ root_dir }}/config"
jellyfin_dir: "{{ root_dir }}/jellyfin"
seerr_dir: "{{ root_dir }}/seerr"
qbittorrent_dir: "{{ root_dir }}/torrent"
management_dir: "{{ root_dir }}/media-management"
# Add provider specific variables to inventory.ini if vpn_enabled is true
# vpn_username: "XXXX"
# vpn_password: "XXXX"
# vpn_wireguard_private_key: "XXXX"
# vpn_wireguard_addresses: "10.0.0.2/32"

# Public Facing Ports (localhost-bound admin UIs)
qbittorrent_port: 8080
prowlarr_port: 9696
radarr_port: 7878
sonarr_port: 8989
bazarr_port: 6767
seerr_port: 5055
jellyfin_port: 8096

# Jellyfin
jellyfin_username: "admin"
jellyfin_server_name: "{{ server_name }}"

# Seerr's admin account is created by authenticating against Jellyfin during
# init, so it reuses the Jellyfin username/password — no separate Seerr vars.

# Internal service URLs (Docker network hostnames)
prowlarr_server: "http://prowlarr:9696"
radarr_server: "http://radarr:7878"
sonarr_server: "http://sonarr:8989"
bazarr_server: "http://bazarr:6767"

# SSH (UFW allow rule) — set ssh_port in inventory.ini if your VPS uses a
# non-standard SSH port, otherwise the firewall will lock you out. Defaults
# to 22 via `| default(22)` where it's used (see comment above).

# qBittorrent WebUI username (defaults to your SSH user)
qbittorrent_username: "{{ ansible_user }}"

# Pinned image versions (verified 2026-07-04). Bump deliberately, then re-run
# the playbook with --tags config,compose so the generated compose.yaml is
# updated before containers are recreated.
traefik_version: "v3.7.6"
jellyfin_version: "10.11.11"
qbittorrent_version: "5.2.2"
radarr_version: "6.2.1"
sonarr_version: "4.0.19"
prowlarr_version: "2.4.0"
# NOTE: confirm the current linuxserver/bazarr tag before deploying (hub.docker.com/r/linuxserver/bazarr/tags).
bazarr_version: "1.5.6"
seerr_version: "v3.3.0"
gluetun_version: "v3.41.1"
